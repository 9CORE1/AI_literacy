<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 정보 관리 - AI 리터러시</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- 상단 네비게이션 (Pill Style) -->
  <div class="navbar-wrapper">
    <div class="container">
      <header class="navbar">
        <a href="/dashboard.html" class="nav-brand">
          <span class="nav-brand-dot"></span>
          <span>AI Literacy Lab</span>
          <span class="nav-tag">PROFILE</span>
        </a>
        <div id="nav-user-menu" class="nav-menu"></div>
      </header>
    </div>
  </div>

  <main class="container" style="max-width: 600px;">
    <div class="card">
      <h2 style="font-size: 1.35rem; margin-bottom: 0.5rem;">내 프로필 관리</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem;">
        입력하신 학과 및 학년 정보는 AI 리터러시 진단 개별 레포트에 자동으로 반영됩니다.
      </p>

      <form id="profile-form">
        <div class="form-group">
          <label class="form-label">이메일 계정 (Google)</label>
          <input type="text" id="prof-email" class="form-control" readonly>
        </div>

        <div class="form-group">
          <label class="form-label">이름</label>
          <input type="text" id="prof-name" class="form-control" required placeholder="성함을 입력하세요">
        </div>

        <div class="form-group">
          <label class="form-label">회원 구분</label>
          <input type="text" id="prof-role" class="form-control" readonly>
        </div>

        <div class="form-group">
          <label id="label-dept" class="form-label">학과 / 전공</label>
          <input type="text" id="prof-dept" class="form-control" placeholder="예: 인공지능학과">
        </div>

        <div class="form-group">
          <label id="label-grade" class="form-label">학년 / 소속</label>
          <input type="text" id="prof-grade" class="form-control" placeholder="예: 2학년">
        </div>

        <div style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 2rem;">
          <a href="/dashboard.html" class="btn btn-secondary">취소</a>
          <button type="submit" class="btn btn-primary">저장하기</button>
        </div>
      </form>
    </div>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/profile.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.init();
      ProfileApp.init();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 정보 관리 - AI 리터러시</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // 비로그인 사용자 즉시 차단 가드 (프로필 정보 노출 차단)
    try {
      var cachedUser = localStorage.getItem('ai_lit_user');
      var u = cachedUser ? JSON.parse(cachedUser) : null;
      if (!u || !u.email) {
        document.documentElement.style.display = 'none';
        alert('내 정보 관리는 로그인 후 이용 가능한 서비스입니다.\n메인 화면에서 로그인 후 이용해 주세요.');
        window.location.replace('index.html?login=true');
      }
    } catch (e) {
      document.documentElement.style.display = 'none';
      window.location.replace('index.html?login=true');
    }
  </script>
</head>
<body>
  <!-- 상단 네비게이션 (Pill Style) -->
  <div class="navbar-wrapper">
    <div class="container">
      <header class="navbar">
        <a href="dashboard.html" class="nav-brand">
          <span class="nav-brand-dot"></span>
          <span>AI Literacy Lab</span>
          <span class="nav-tag">PROFILE</span>
        </a>
        <div id="nav-user-menu" class="nav-menu"></div>
      </header>
    </div>
  </div>

  <main class="container" style="max-width: 600px;">
    <div class="card">
      <h2 style="font-size: 1.35rem; margin-bottom: 0.5rem;">내 프로필 관리</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem;">
        입력하신 학과 및 학년 정보는 AI 리터러시 진단 개별 레포트에 자동으로 반영됩니다.
      </p>

      <form id="profile-form">
        <div class="form-group">
          <label class="form-label">이메일 계정 (Google)</label>
          <input type="text" id="prof-email" class="form-control" readonly>
        </div>

        <div class="form-group">
          <label class="form-label">이름</label>
          <input type="text" id="prof-name" class="form-control" required placeholder="성함을 입력하세요">
        </div>

        <div class="form-group">
          <label class="form-label">회원 구분</label>
          <input type="text" id="prof-role" class="form-control" readonly>
        </div>

        <div class="form-group">
          <label class="form-label">학교명</label>
          <input type="text" id="prof-university" class="form-control" placeholder="예: 한국대학교">
        </div>

        <div class="form-group">
          <label id="label-dept" class="form-label">학과 / 전공</label>
          <input type="text" id="prof-dept" class="form-control" placeholder="예: 인공지능학과">
        </div>

        <div class="form-group">
          <label id="label-grade" class="form-label">학년 / 직급</label>
          <input type="text" id="prof-grade" class="form-control" placeholder="예: 2학년 / 담당">
        </div>

        <div style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 2rem;">
          <a href="dashboard.html" class="btn btn-secondary">취소</a>
          <button type="submit" class="btn btn-primary">저장하기</button>
        </div>
      </form>
    </div>

    <!-- 최근 입장 이력 로그 카드 -->
    <div class="card" style="margin-top: 24px;">
      <h3 style="font-size: 1.15rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 8px;">
        🕒 최근 강의실 입장 이력 (최근 10건)
      </h3>
      <p style="font-size: 0.85rem; color: #666; margin-bottom: 1rem;">
        구글 간편입장 및 아이디 로그인 시 안전하게 기록된 최근 접속 이력입니다.
      </p>
      <div id="login-history-list" style="display: flex; flex-direction: column; gap: 8px;">
        <!-- profile.js에서 동적 렌더링 -->
      </div>
    </div>
  </main>

  <!-- Firebase SDK (v10 compat) & Config -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.init();
      ProfileApp.init();
    });
  </script>
</body>
</html>

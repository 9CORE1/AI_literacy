<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 | AI LITERACY LAB</title>
  <meta name="description" content="대학생 및 교직원을 위한 맞춤형 AI 리터러시 교육 플랫폼 회원가입">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Register Page Custom Styles adhering to Caldera Design System */
    .register-viewport {
      min-height: 100vh;
      background-color: var(--surface-limestone-surface);
      display: flex;
      flex-direction: column;
      word-break: keep-all;
    }

    .register-header {
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--color-pumice);
      background-color: var(--color-chalk);
    }

    .register-brand {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 800;
      color: var(--color-obsidian);
      letter-spacing: -0.5px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .register-brand span {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--color-ember);
    }

    .register-main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 48px 20px;
    }

    .register-card {
      width: 100%;
      max-width: 620px;
      background: var(--color-chalk);
      border: 1px solid var(--color-pumice);
      border-radius: 36px;
      padding: 44px 36px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.04);
    }

    .register-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 800px;
      font-size: 13px;
      font-weight: 700;
      background: #eee8fc;
      color: var(--color-ember);
      margin-bottom: 16px;
    }

    .register-title {
      font-family: var(--font-display);
      font-size: clamp(26px, 4vw, 34px);
      font-weight: 800;
      color: var(--color-obsidian);
      line-height: 1.25;
      margin-bottom: 10px;
    }

    .register-subtitle {
      font-size: 15px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    /* Role Selection Pills */
    .role-selection-group {
      margin-bottom: 28px;
    }

    .role-selection-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--color-obsidian);
      margin-bottom: 10px;
      display: block;
    }

    .role-pills {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .role-pill-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 20px;
      border-radius: 20px;
      border: 2px solid var(--color-pumice);
      background: var(--color-chalk);
      color: var(--color-obsidian);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      min-height: 56px;
    }

    .role-pill-btn:hover {
      border-color: #c4b5fd;
      background: #faf8ff;
    }

    .role-pill-btn.active {
      border-color: var(--color-ember);
      background: #f3edff;
      color: var(--color-ember);
      box-shadow: 0 4px 14px rgba(85, 56, 150, 0.15);
    }

    .role-desc-tip {
      margin-top: 10px;
      font-size: 13px;
      color: #777;
      background: #fbfbfa;
      padding: 10px 14px;
      border-radius: 12px;
      border-left: 3px solid var(--color-ember);
    }

    /* Form Fields Grid */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .form-grid-full {
      grid-column: span 2;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-label {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--color-obsidian);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .input-label span.req {
      color: #e53e3e;
      font-size: 13px;
      margin-left: 4px;
    }

    .input-field {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1.5px solid var(--color-pumice);
      background: var(--color-chalk);
      font-family: inherit;
      font-size: 15px;
      color: var(--color-obsidian);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      min-height: 48px;
    }

    .input-field:focus {
      border-color: var(--color-ember);
      box-shadow: 0 0 0 3px rgba(85, 56, 150, 0.15);
    }

    .input-field::placeholder {
      color: #aaa;
    }

    /* Submit Button */
    .btn-register-submit {
      width: 100%;
      margin-top: 28px;
      padding: 18px 24px;
      background: var(--color-ember);
      color: #fff;
      border: none;
      border-radius: 800px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s, transform 0.1s;
      min-height: 54px;
    }

    .btn-register-submit:hover {
      background: var(--color-violet-hover);
      transform: translateY(-1px);
    }

    .btn-register-submit:active {
      transform: translateY(1px);
    }

    /* Footer switch */
    .register-footer-switch {
      margin-top: 24px;
      text-align: center;
      font-size: 14.5px;
      color: #666;
    }

    .register-footer-switch a {
      color: var(--color-ember);
      font-weight: 700;
      text-decoration: underline;
      margin-left: 6px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .register-card {
        padding: 30px 20px;
        border-radius: 28px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-grid-full {
        grid-column: span 1;
      }

      .role-pills {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body class="register-viewport">

  <!-- Header -->
  <header class="register-header">
    <a href="index.html" class="register-brand">
      <span></span> AI LITERACY LAB
    </a>
    <a href="index.html?login=true" style="font-size: 14px; font-weight: 700; color: #555; text-decoration: none;">
      기존 계정 로그인 →
    </a>
  </header>

  <!-- Main Registration Container -->
  <main class="register-main">
    <div class="register-card">
      <div class="register-badge">
        ✨ NEW REGISTRATION
      </div>
      <h1 class="register-title">회원가입 및 맞춤 프로필 설정</h1>
      <p class="register-subtitle">
        학습자 역할을 선택하고 소속 정보를 입력하시면 역할별 맞춤형 AI 리터러시 진단 도구와 강의실을 제공합니다.
      </p>

      <form id="register-form" onsubmit="handleRegistrationSubmit(event)">
        <!-- 1. Role Selection -->
        <div class="role-selection-group">
          <label class="role-selection-label">
            학습자 역할 선택 <span style="color: #e53e3e;">*</span>
          </label>
          <div class="role-pills">
            <button type="button" class="role-pill-btn active" id="btn-role-student" onclick="selectRole('student')">
              <span style="font-size: 20px;">🎓</span> 대학생 (학부/대학원생)
            </button>
            <button type="button" class="role-pill-btn" id="btn-role-staff" onclick="selectRole('staff')">
              <span style="font-size: 20px;">🏛️</span> 교직원 (교원/연구원/행정)
            </button>
          </div>
          <div class="role-desc-tip" id="role-tip">
            💡 <strong>대학생 모드:</strong> 기초 디지털 리터러시부터 실무 AI 도구 활용, 문제해결 및 윤리 평가 로드맵이 제공됩니다.
          </div>
        </div>

        <!-- 2. Form Fields Grid -->
        <div class="form-grid">
          <!-- Name -->
          <div class="input-group">
            <label class="input-label" for="reg-name">
              이름 (성명)<span class="req">*</span>
            </label>
            <input type="text" id="reg-name" class="input-field" placeholder="홍길동" required autocomplete="name">
          </div>

          <!-- Username -->
          <div class="input-group">
            <label class="input-label" for="reg-username">
              아이디<span class="req">*</span>
            </label>
            <input type="text" id="reg-username" class="input-field" placeholder="영문/숫자 (예: user123)" required autocomplete="username">
          </div>

          <!-- Password -->
          <div class="input-group">
            <label class="input-label" for="reg-password">
              비밀번호<span class="req">*</span>
            </label>
            <input type="password" id="reg-password" class="input-field" placeholder="6자리 이상 입력" required autocomplete="new-password">
          </div>

          <!-- Password Confirm -->
          <div class="input-group">
            <label class="input-label" for="reg-password-confirm">
              비밀번호 확인<span class="req">*</span>
            </label>
            <input type="password" id="reg-password-confirm" class="input-field" placeholder="비밀번호 다시 입력" required autocomplete="new-password">
          </div>

          <!-- Email (Full Width) -->
          <div class="input-group form-grid-full">
            <label class="input-label" for="reg-email">
              이메일 주소<span class="req">*</span>
            </label>
            <input type="email" id="reg-email" class="input-field" placeholder="hong@university.ac.kr" required autocomplete="email">
          </div>

          <!-- University -->
          <div class="input-group">
            <label class="input-label" for="reg-university">
              학교명<span class="req">*</span>
            </label>
            <input type="text" id="reg-university" class="input-field" placeholder="예: 한국대학교" required>
          </div>

          <!-- Department -->
          <div class="input-group">
            <label class="input-label" for="reg-department">
              학과 / 소속부서<span class="req">*</span>
            </label>
            <input type="text" id="reg-department" class="input-field" placeholder="예: 컴퓨터공학과 / 교무처" required>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-register-submit" id="btn-submit-register">
          회원가입 완료 및 맞춤 강의실 입장 →
        </button>
      </form>

      <!-- Footer switch -->
      <div class="register-footer-switch">
        이미 계정이 있으신가요?
        <a href="index.html?login=true">로그인하기 →</a>
      </div>
    </div>
  </main>

  <!-- Firebase SDK (v10 compat) & Config -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Selected Role State (default: student)
    let selectedRole = 'student';

    function selectRole(role) {
      selectedRole = role;
      const btnStudent = document.getElementById('btn-role-student');
      const btnStaff = document.getElementById('btn-role-staff');
      const roleTip = document.getElementById('role-tip');

      if (role === 'student') {
        btnStudent.classList.add('active');
        btnStaff.classList.remove('active');
        roleTip.innerHTML = '💡 <strong>대학생 모드:</strong> 기초 디지털 리터러시부터 실무 AI 도구 활용, 문제해결 및 윤리 평가 로드맵이 제공됩니다.';
      } else {
        btnStaff.classList.add('active');
        btnStudent.classList.remove('active');
        roleTip.innerHTML = '💡 <strong>교직원 모드:</strong> 행정 업무 자동화, 수업 설계 및 학생 AI 과제 지도, 대학 AI 거버넌스 가이드가 제공됩니다.';
      }
    }

    function handleRegistrationSubmit(e) {
      e.preventDefault();

      const name = document.getElementById('reg-name').value.trim();
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;
      const passwordConfirm = document.getElementById('reg-password-confirm').value;
      const email = document.getElementById('reg-email').value.trim();
      const university = document.getElementById('reg-university').value.trim();
      const department = document.getElementById('reg-department').value.trim();

      // Basic validation
      if (!name || !username || !password || !email || !university || !department) {
        alert('모든 필수 입력 항목을 채워주세요.');
        return;
      }

      if (password.length < 6) {
        alert('비밀번호는 최소 6자리 이상이어야 합니다.');
        document.getElementById('reg-password').focus();
        return;
      }

      if (password !== passwordConfirm) {
        alert('비밀번호와 비밀번호 확인이 일치하지 않습니다. 다시 확인해 주세요.');
        document.getElementById('reg-password-confirm').focus();
        return;
      }

      if (typeof Auth === 'undefined') {
        alert('인증 시스템을 초기화하는 중입니다. 잠시 후 다시 시도해 주세요.');
        return;
      }

      const res = Auth.registerUser({
        role: selectedRole,
        name: name,
        username: username,
        password: password,
        email: email,
        university: university,
        department: department
      });

      if (!res.success) {
        alert(res.message);
        return;
      }

      alert(`환영합니다, ${name}님!\n[${selectedRole === 'staff' ? '교직원' : '대학생'}] 역할로 가입이 완료되었습니다.\n맞춤형 강의실로 이동합니다.`);
      window.location.href = 'dashboard.html';
    }

    // Auto-select role if specified in query string (?role=staff or ?role=student)
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const roleParam = params.get('role');
      if (roleParam === 'staff' || roleParam === 'student') {
        selectRole(roleParam);
      }
    });
  </script>
</body>

</html>

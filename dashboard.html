<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>맞춤형 교육 대시보드 — AI Literacy Lab</title>
  <link rel="icon" type="image/png" href="literacy_logo.png">
  <link rel="stylesheet" href="css/style.css?v=20261030_staff_editall">
  <script>
    // 비로그인 사용자 즉시 차단 가드 (컨텐츠 노출 차단, 창 닫으면 자동 로그아웃)
    try {
      var cachedUser = sessionStorage.getItem('ai_lit_user');
      var u = cachedUser ? JSON.parse(cachedUser) : null;
      if (!u || !u.email) {
        document.documentElement.style.display = 'none';
        alert('로그인이 필요한 서비스입니다.\n메인 화면에서 로그인 또는 회원가입 후 입장해 주세요.');
        window.location.replace('index.html?login=true');
      }
    } catch (e) {
      document.documentElement.style.display = 'none';
      window.location.replace('index.html?login=true');
    }
  </script>
</head>
<body>
  <!-- 상단 네비게이션 (Pill Style) -->
  <div class="navbar-wrapper">
    <div class="container">
      <header class="navbar">
        <a href="dashboard.html" class="nav-brand">
          <span class="nav-brand-dot"></span>
          <span>AI Literacy Lab</span>
          <span class="nav-tag" id="nav-mode-tag">CLASSROOM</span>
        </a>
        <div id="nav-user-menu" class="nav-menu"></div>
      </header>
    </div>
  </div>

  <main class="container">
    <div id="dashboard-content">
      <!-- dashboard.js에서 역할(학생/교직원)에 따라 동적으로 렌더링 -->
      <div style="text-align: center; padding: 4rem 1rem;">
        <p style="font-size: 1.1rem; color: #555;">맞춤형 교육 강의실을 구성하는 중입니다...</p>
      </div>
    </div>
  </main>

  <!-- 우측 하단 강의 퀵 네비게이션 (Floating Quick Navigation Dock) -->
  <aside id="floating-quick-nav" class="floating-quick-nav" aria-label="강의 바로가기 네비게이션">
    <div class="quick-nav-panel" id="quick-nav-panel">
      <div class="quick-nav-header">
        <span class="quick-nav-title" id="quick-nav-title">📚 강의 바로가기</span>
        <button type="button" class="quick-nav-close" onclick="DashboardApp.toggleQuickNav()" aria-label="네비게이션 닫기">✕</button>
      </div>
      <nav class="quick-nav-list" id="quick-nav-list">
        <button type="button" class="quick-nav-item" data-target="lecture-sec-1" onclick="DashboardApp.scrollToSection('lecture-sec-1')">
          <span class="nav-badge">01</span>
          <span class="nav-text">AI 리터러시 진단</span>
        </button>
        <button type="button" class="quick-nav-item" data-target="lecture-sec-2" onclick="DashboardApp.scrollToSection('lecture-sec-2')">
          <span class="nav-badge">02</span>
          <span class="nav-text">프롬프트 공식 4+2</span>
        </button>
        <button type="button" class="quick-nav-item" data-target="lecture-sec-3" onclick="DashboardApp.scrollToSection('lecture-sec-3')">
          <span class="nav-badge">03</span>
          <span class="nav-text">NotebookLM 활용</span>
        </button>
        <button type="button" class="quick-nav-item" data-target="lecture-sec-4" onclick="DashboardApp.scrollToSection('lecture-sec-4')">
          <span class="nav-badge">04</span>
          <span class="nav-text">구글 시트 Gemini</span>
        </button>
      </nav>
      <div class="quick-nav-footer">
        <button type="button" class="quick-nav-top-btn" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })">
          <span>▲ 맨 위로 (Top)</span>
        </button>
      </div>
    </div>
    
    <!-- 플로팅 토글 버튼 (메뉴 열기/닫기) -->
    <button type="button" class="quick-nav-toggle-btn" id="quick-nav-toggle-btn" onclick="DashboardApp.toggleQuickNav()" aria-expanded="false" title="강의 바로가기 메뉴 열기/닫기">
      <span class="toggle-icon">🧭</span>
      <span class="toggle-label">강의 이동</span>
      <span class="toggle-indicator">▲</span>
    </button>
  </aside>

  <!-- 하단 플로팅 AI 도구 바로가기 바 (상단 네비게이션과 동일한 Floating Pill 스타일) -->
  <div class="floating-bottom-wrapper">
    <div class="container">
      <div class="floating-partner-strip">
        <a href="https://gemini.google.com" target="_blank" rel="noopener noreferrer" class="partner-item"
          title="Gemini 공식 사이트 열기">GEMINI</a>
        <div class="dotted-v-divider"></div>
        <a href="https://chatgpt.com" target="_blank" rel="noopener noreferrer" class="partner-item"
          title="ChatGPT 공식 사이트 열기">CHATGPT</a>
        <div class="dotted-v-divider"></div>
        <a href="https://claude.ai" target="_blank" rel="noopener noreferrer" class="partner-item"
          title="Claude 공식 사이트 열기">CLAUDE</a>
        <div class="dotted-v-divider"></div>
        <a href="https://notebooklm.google.com" target="_blank" rel="noopener noreferrer" class="partner-item"
          title="Gemini NotebookLM 공식 사이트 열기">GEMINI NOTEBOOKLM</a>
        <div class="dotted-v-divider"></div>
        <a href="https://workspace.google.com" target="_blank" rel="noopener noreferrer" class="partner-item"
          title="Google Workspace 공식 사이트 열기">GOOGLE WORKSPACE</a>
      </div>
    </div>
  </div>

  <!-- Caldera Footer -->
  <footer class="caldera-footer" style="padding-bottom: 84px;">
    <div class="container">
      <div class="footer-top">
        <div class="footer-brand">AI LITERACY LAB</div>
        <div>
          <a href="dashboard.html" style="font-weight: 600;">맞춤형 강의실</a>
        </div>
      </div>
      <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; line-height: 1.6;">
        <div>
          © 2026 AI Literacy Lab. Caldera Light Theme Architecture. All rights reserved.
        </div>
        <div>
          본 플랫폼의 진단 척도 및 결과 알고리즘은 학술 연구 윤리 지침을 준수합니다.
        </div>
      </div>
    </div>
  </footer>

  <!-- Firebase SDK (v10 compat) & Config -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js?v=20261029_roleguard"></script>
  <script src="js/dashboard.js?v=20261030_cntitle3"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.init();
      DashboardApp.init();
    });
  </script>
</body>
</html>

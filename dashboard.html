<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>맞춤형 교육 대시보드 — AI Literacy Lab</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // 비로그인 사용자 즉시 차단 가드 (컨텐츠 노출 차단)
    try {
      var cachedUser = localStorage.getItem('ai_lit_user');
      var u = cachedUser ? JSON.parse(cachedUser) : null;
      if (!u || !u.email) {
        document.documentElement.style.display = 'none';
        alert('로그인이 필요한 서비스입니다.\n메인 화면에서 로그인 또는 회원가입 후 입장해 주세요.');
        window.location.replace('index.html?login=true');
      }
    } catch (e) {
      document.documentElement.style.display = 'none';
      window.location.replace('index.html?login=true');
    }
  </script>
</head>
<body>
  <!-- 상단 네비게이션 (Pill Style) -->
  <div class="navbar-wrapper">
    <div class="container">
      <header class="navbar">
        <a href="dashboard.html" class="nav-brand">
          <span class="nav-brand-dot"></span>
          <span>AI Literacy Lab</span>
          <span class="nav-tag" id="nav-mode-tag">CLASSROOM</span>
        </a>
        <div id="nav-user-menu" class="nav-menu"></div>
      </header>
    </div>
  </div>

  <main class="container" style="padding-bottom: var(--spacing-64);">
    <div id="dashboard-content">
      <!-- dashboard.js에서 역할(학생/교직원)에 따라 동적으로 렌더링 -->
      <div style="text-align: center; padding: 4rem 1rem;">
        <p style="font-size: 1.1rem; color: #555;">맞춤형 교육 강의실을 구성하는 중입니다...</p>
      </div>
    </div>
  </main>

  <!-- Firebase SDK (v10 compat) & Config -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.init();
      DashboardApp.init();
    });
  </script>
</body>
</html>
